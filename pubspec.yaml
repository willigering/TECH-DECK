name: tech_deck
description: "TECH//DECK – Karteikarten-App für Fachinformatiker. Entwickler: Willi Gering."
publish_to: "none"
version: 1.5.0+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^10.3.10
  uuid: ^4.5.1
  provider: ^6.1.5
  intl: ^0.20.2
  url_launcher: ^6.3.2
  http: ^1.5.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: "#070605"
  adaptive_icon_foreground: assets/app_icon.png
  adaptive_icon_foreground_inset: 12

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/logo.png
    - assets/decks/
  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
