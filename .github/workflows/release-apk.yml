# Historical file name retained so existing Actions links remain valid.
# Manual build only: no GitHub release and no Play Console upload.
name: Build Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-store-aab
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies, analysis and tests
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Check version consistency
        run: |
          V=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          NAME=${V%+*}; CODE=${V#*+}
          grep -q "version = '$NAME'" lib/core/app_info.dart
          grep -q "buildNumber = $CODE;" lib/core/app_info.dart
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
      - name: Build AAB with the existing key and verify its signer
        env:
          KS: ${{ secrets.TECHDECK_KEYSTORE_BASE64 }}
          TECHDECK_KEYSTORE_PASSWORD: ${{ secrets.TECHDECK_KEYSTORE_PASSWORD }}
          TECHDECK_KEY_ALIAS: ${{ secrets.TECHDECK_KEY_ALIAS }}
          TECHDECK_KEY_PASSWORD: ${{ secrets.TECHDECK_KEY_PASSWORD }}
          EXPECTED: ${{ vars.TECHDECK_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KS" || -z "$TECHDECK_KEYSTORE_PASSWORD" || -z "$TECHDECK_KEY_ALIAS" || -z "$TECHDECK_KEY_PASSWORD" ]]; then
            echo "::error::Original signing credentials are missing. No build."
            exit 1
          fi
          EXPECTED=$(printf '%s' "$EXPECTED" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Expected signing certificate fingerprint is missing or invalid."
            exit 1
          fi
          export TECHDECK_KEYSTORE_PATH="$RUNNER_TEMP/techdeck.keystore"
          trap 'rm -f "$TECHDECK_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$KS" | base64 --decode > "$TECHDECK_KEYSTORE_PATH"
          flutter build appbundle --release
          AAB=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB"
          ACTUAL=$(keytool -J-Duser.language=en -printcert -jarfile "$AAB" | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::AAB was signed with an unexpected key. Build rejected."
            exit 1
          fi
          mkdir -p dist
          cp "$AAB" "dist/TECH-DECK-$NAME+$CODE.aab"
          sha256sum "dist/TECH-DECK-$NAME+$CODE.aab" > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: TECH-DECK-Play-${{ env.NAME }}+${{ env.CODE }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
